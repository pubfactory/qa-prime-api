# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: UserFlows.yml
    
on:
  workflow_dispatch:
    inputs:
      gitcommitId:
        required: true
        description: "get git commit Id from prime-frontend"
        type: string
        default: ''
      jobId:
        required: true
        description: "get job Id from prime-frontend"
        type: string
        default: ''
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      id: checkout-gitrepo
    - name: Set up JDK 11
      id: install-java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Install Google Chrome
      uses: browser-actions/setup-chrome@latest
      id: install-chrome
    - name: Navigating to chromedriver and making it executable
      id: chromedriver-executable
      run: |
          cd /home/runner/work/qa-prime-e2e/qa-prime-e2e/src/test/resources
          chmod +x chromedriver
    - name: Build with Maven
      id: run-test-case
      run: mvn test -DsuiteXmlFile=UserFlowsPrimeConfig.xml  -DEnvironment=dev -Dbrowser=chrome

    - name: Gather Allure Results
      id: parse-allure-results
      run: |
        PASSED=$(grep -o '"status":"passed"' target/allure-results/*.json | wc -l || echo 0)
        FAILED=$(grep -o '"status":"failed"' target/allure-results/*.json | wc -l || echo 0)
        TOTAL=$((PASSED + FAILED))
        echo "PASSED=$PASSED" >> $GITHUB_ENV
        echo "FAILED=$FAILED" >> $GITHUB_ENV
        echo "TOTAL=$TOTAL" >> $GITHUB_ENV
        
    - name: Debug Allure Results
      run: |
        echo "Inspecting Allure Results Directory:"
        ls -l target/allure-results/
        echo "Sample JSON File Content:"
        cat target/allure-results/*.json | head -n 50

    - name: Get Allure history
      uses: actions/checkout@v2
      id: allure-history
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages

    - name: Allure Report action from marketplace
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          
    - name: Deploy report to Github Pages
      id: gh-pages
      if: always()
      uses: peaceiris/actions-gh-pages@v2
      env:
        PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PUBLISH_BRANCH: gh-pages
        PUBLISH_DIR: allure-history
        keep_files: true
        


    - name: Send ${{ job.status }} message to #qa-prime-integration room
      if: always()
      uses: act10ns/slack@v2.0.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
        status: ${{ job.status }}
        steps: ${{ toJson(steps) }}
        channel: '#qa-prime-integration'
        message: |
          *Build Status*: *${{ job.status }}*.
          *Environment*: DEV.
          *Total Test Cases*: ${{ env.TOTAL }}.
          *Passed*: ${{ env.PASSED }}.
          *Failed*: ${{ env.FAILED }}.
          Allure report URL: https://pubfactory.github.io/qa-prime-e2e/${{ github.run_number }}
          Git commit ID: ${{ inputs.gitcommitId }}.
          Prime-frontend job: https://github.com/pubfactory/prime-frontend/actions/runs/${{ inputs.jobId }}.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        

    
